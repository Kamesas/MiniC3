  [env:lolin_c3_mini]                                                                                                                                                           
  platform = espressif32                                                                                                                                                        
  board = lolin_c3_mini                                                                                                                                                         
  framework = arduino                                                                                                                                                           
  monitor_speed = 115200
  monitor_port = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_88:56:A6:74:45:34-if00
  upload_port = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_88:56:A6:74:45:34-if00
  monitor_rts = 0
  monitor_dtr = 0                                                                                                                                                        
  build_flags =
      -Wno-unknown-pragmas
      -DARDUINO_USB_MODE=1
      -DARDUINO_USB_CDC_ON_BOOT=1
      ; Add -DDISPLAY_TEST to switch to src/display_test.cpp instead
      ; of the real app (useful for debugging the OLED in isolation).
  lib_deps =                                                                                                                                                                    
      adafruit/DHT sensor library@^1.4.6                                                                                                                                        
      adafruit/Adafruit Unified Sensor@^1.1.14                                                                                                                                  
      olikraus/U8g2@^2.35.19                                                                                                                                                    
